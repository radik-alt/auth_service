services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    env_file: auth/.env # JWT_SECRET и TTL
    environment:
      GRPC_ADDR: ":50051"
      REDIS_ADDR: "redis:6379"
      USER_GRPC_ADDR: "user:50051"
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      AUTH_GRPC_ADDR: "auth:50051"
      USER_GRPC_ADDR: "user:50051"
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - user
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d users"]
      interval: 5s
      timeout: 3s
      retries: 5

  # одноразовый контейнер: применяет миграции и завершается
  user-migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./user/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://user:user@postgres:5432/users?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    environment:
      GRPC_ADDR: ":50051"
      DATABASE_URL: "postgres://user:user@postgres:5432/users?sslmode=disable"
    ports:
      - "50052:50051"
    depends_on:
      user-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
