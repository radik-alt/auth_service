syntax = "proto3";

package auth;

import "google/api/annotations.proto";

option go_package = "github.com/radik-alt/auth_service/auth/pkg/auth/v1;authv1";

service AuthService {

  rpc LogIn(LogInRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout-all"
      body: "*"
    };
  }

  // Внутренний метод (без HTTP) для gateway: проверяет подпись, срок и отзыв access-токена
  // и возвращает, чей он. Невалидный, истёкший или отозванный токен — UNAUTHENTICATED.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message LogInRequest {
  // раньше здесь был uint64 user_id: номер и имя не переиспользуем
  reserved 1;
  reserved "user_id";

  string email = 2;
  string password = 3;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  uint64 expires_in = 3;
  string token_type = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutResponse {}

message LogoutAllRequest {
  string access_token = 1;
}

message LogoutAllResponse {}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;  // UUID
}
